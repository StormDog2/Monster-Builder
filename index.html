<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Build your monster</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="theme-color" content="#2B2148">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monster">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --ink:#241C3B;
    --shell:#2B2148;
    --shell-dark:#211940;
    --panel:#392C63;
    --paper:#F4EFE1;
    --accent:#FFC94A;
    --font-display:"Chalkboard SE","Marker Felt","Comic Sans MS",system-ui,sans-serif;
    --font-ui:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;padding:0;height:100%;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }

  body{
    position:fixed;inset:0;
    background:var(--shell);
    font-family:var(--font-ui);
    color:var(--paper);
    touch-action:none;
  }

  .app{
    display:flex;flex-direction:column;
    height:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
    padding:8px 14px;
    background:var(--shell-dark);
  }
  h1{
    margin:0;
    font-family:var(--font-display);
    font-size:clamp(18px,2.6vw,26px);
    font-weight:400;
    letter-spacing:.5px;
  }
  h1 .dot{color:var(--accent);}

  /* ---------- main split ---------- */
  main{
    flex:1 1 auto;min-height:0;
    display:flex;
  }

  .panel{
    flex:0 0 172px;
    display:flex;flex-direction:column;
    gap:10px;
    padding:12px 10px;
    background:var(--panel);
    overflow:hidden;
    min-height:0;
  }
  .parts-block{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}

  .field-label{
    font-size:11px;text-transform:uppercase;letter-spacing:1.4px;
    opacity:.65;margin-bottom:6px;
  }

  .colour-row{display:flex;align-items:center;gap:8px;}
  .swatch{
    flex:0 0 auto;width:28px;height:28px;border-radius:8px;
    border:3px solid var(--ink);
    box-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  select{
    flex:1 1 auto;min-width:0;
    font-family:var(--font-ui);font-size:17px;font-weight:600;
    color:var(--ink);background:var(--paper);
    border:3px solid var(--ink);border-radius:10px;
    padding:8px 6px;
    appearance:none;-webkit-appearance:none;
    text-align:center;
  }

  .status{
    flex:0 0 auto;padding-top:4px;
    font-size:10px;letter-spacing:.9px;
    opacity:.45;text-align:center;
  }

  .parts{
    display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;
    gap:6px;flex:1 1 auto;min-height:0;
  }
  .tile{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:4px 2px;min-height:0;overflow:hidden;
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:14px;
    box-shadow:0 3px 0 rgba(0,0,0,.28);
    touch-action:none;cursor:grab;
    transition:transform .12s ease;
  }
  .tile:active{transform:scale(.96);}
  .tile svg{display:block;flex:1 1 auto;width:100%;height:100%;min-height:0;}
  .tile span{
    flex:0 0 auto;line-height:1.1;
    font-family:var(--font-display);
    font-size:11px;color:var(--ink);
  }

  /* ---------- stage ---------- */
  .stage-wrap{flex:1 1 auto;min-width:0;padding:12px;}
  #stage{
    position:relative;
    width:100%;height:100%;
    background-color:var(--paper);
    background-image:radial-gradient(rgba(36,28,59,.11) 1.6px,transparent 1.6px);
    background-size:26px 26px;
    border-radius:18px;
    border:3px solid var(--ink);
    overflow:hidden;
    touch-action:none;
  }

  .hint{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);
    font-size:clamp(16px,2.2vw,22px);
    color:rgba(36,28,59,.42);
    pointer-events:none;text-align:center;padding:20px;
  }

  .counter{
    position:absolute;top:10px;right:12px;z-index:99999;
    font-family:var(--font-ui);font-size:12px;font-weight:600;
    letter-spacing:.5px;color:var(--ink);
    background:rgba(255,255,255,.72);
    border:2px solid rgba(36,28,59,.28);
    border-radius:999px;padding:3px 10px;
    pointer-events:none;opacity:0;
    transition:opacity .2s ease,background .2s ease,border-color .2s ease;
  }
  .counter.show{opacity:.85;}
  .counter.full{
    background:var(--accent);border-color:var(--ink);opacity:1;
  }
  .counter.bump{animation:bump .3s ease;}
  @keyframes bump{
    0%,100%{transform:scale(1);}
    35%{transform:scale(1.18);}
  }

  .counter{
    position:absolute;top:8px;right:10px;z-index:500;
    font-family:var(--font-ui);font-size:12px;font-weight:700;letter-spacing:.5px;
    color:rgba(36,28,59,.45);background:rgba(255,255,255,.62);
    border-radius:20px;padding:3px 10px;
    pointer-events:none;
  }
  .counter.warn{color:#8A5300;background:rgba(255,201,74,.7);}
  .counter.full{color:#fff;background:#E24A3B;}
  .counter.bump{animation:bump .32s ease;}
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}

  .piece{
    position:absolute;
    touch-action:none;
    will-change:transform;
  }
  .piece svg{
    display:block;width:100%;height:100%;
    filter:drop-shadow(0 3px 0 rgba(36,28,59,.16));
    pointer-events:none;
  }
  .piece.selected{
    outline:3px dashed var(--accent);
    outline-offset:6px;
    border-radius:6px;
  }

  /* ---------- toolbar ---------- */
  footer{
    flex:0 0 auto;
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    padding:8px 10px;
    background:var(--shell-dark);
  }
  .btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:64px;padding:5px 9px 4px;
    font-family:var(--font-ui);
    background:var(--paper);color:var(--ink);
    border:3px solid var(--ink);border-radius:12px;
    box-shadow:0 3px 0 rgba(0,0,0,.3);
    cursor:pointer;touch-action:manipulation;
    transition:transform .1s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0);}
  .btn .glyph{font-size:20px;line-height:1;font-weight:700;}
  .btn .lbl{font-size:11px;letter-spacing:.6px;text-transform:lowercase;margin-top:2px;}
  .btn.is-off{opacity:.34;pointer-events:none;}
  .btn.ghost{background:transparent;color:var(--paper);border-color:rgba(244,239,225,.5);box-shadow:none;}
  .btn.ghost .glyph{font-size:15px;}

  /* ---------- overlays: share + gallery ---------- */
  .sheet{
    position:fixed;inset:0;z-index:9000;
    display:none;align-items:center;justify-content:center;
    background:rgba(20,15,36,.82);
    padding:18px;
  }
  .sheet.open{display:flex;}
  .sheet-inner{
    background:var(--paper);color:var(--ink);
    border:3px solid var(--ink);border-radius:20px;
    box-shadow:0 8px 0 rgba(0,0,0,.35);
    padding:18px;
    max-width:min(92vw,760px);max-height:92vh;
    display:flex;flex-direction:column;gap:12px;
    overflow:auto;
  }
  .sheet h2{
    margin:0;font-family:var(--font-display);font-weight:400;
    font-size:clamp(17px,2.4vw,23px);text-align:center;
  }
  .sheet .sub{margin:0;text-align:center;font-size:13px;opacity:.7;}

  .qr-card{
    align-self:center;
    background:#fff;padding:14px;border-radius:12px;
    border:3px solid var(--ink);
  }
  .qr-card svg{display:block;width:min(58vw,300px);height:auto;}

  .name-row{display:flex;gap:8px;align-items:center;justify-content:center;}
  .name-row input{
    font-family:var(--font-ui);font-size:16px;
    padding:8px 10px;width:min(48vw,190px);
    border:3px solid var(--ink);border-radius:10px;
    background:#fff;color:var(--ink);
  }

  .code-line{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;word-break:break-all;text-align:center;
    background:rgba(36,28,59,.07);border-radius:8px;padding:8px;
    max-height:64px;overflow:auto;
  }

  .sheet-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  .gallery{
    display:grid;gap:12px;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  }
  .g-card{
    background:#fff;border:3px solid var(--ink);border-radius:14px;
    padding:6px;display:flex;flex-direction:column;gap:4px;
    cursor:pointer;
  }
  .g-stage{
    position:relative;width:100%;aspect-ratio:4/3;
    background-color:var(--paper);border-radius:8px;overflow:hidden;
  }
  .g-name{
    font-family:var(--font-display);font-size:14px;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .gpiece{position:absolute;}
  .gpiece svg{display:block;width:100%;height:100%;}

  .g-big{position:relative;width:min(84vw,680px);aspect-ratio:4/3;
         background-color:var(--paper);border:3px solid var(--ink);
         border-radius:14px;overflow:hidden;align-self:center;}

  .empty-note{text-align:center;opacity:.6;font-size:14px;padding:20px;}

  /* ---------- confirm ---------- */
  .veil{
    position:absolute;inset:0;z-index:100000;
    display:none;align-items:center;justify-content:center;
    background:rgba(36,28,59,.55);
    border-radius:15px;
  }
  .veil.open{display:flex;}
  .card{
    background:var(--paper);color:var(--ink);
    border:3px solid var(--ink);border-radius:16px;
    padding:18px 22px;text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.3);
  }
  .card p{margin:0 0 14px;font-family:var(--font-display);font-size:19px;}
  .card .row{display:flex;gap:10px;justify-content:center;}

  @media (max-width:620px){
    .panel{flex-basis:132px;}
    .btn{min-width:54px;padding:4px 6px 3px;}
    .btn .lbl{font-size:10px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>Build your monster<span class="dot">.</span></h1>
    <div style="display:flex;gap:8px;">
      <button class="btn ghost" id="galleryBtn" style="display:none"><span class="glyph">▦</span><span class="lbl">monsters</span></button>
      <button class="btn ghost" id="shareBtn"><span class="glyph">▣</span><span class="lbl">share</span></button>
      <button class="btn ghost" id="resetBtn"><span class="glyph">↺</span><span class="lbl">start again</span></button>
    </div>
  </header>

  <main>
    <aside class="panel">
      <div>
        <div class="field-label">colour</div>
        <div class="colour-row">
          <div class="swatch" id="swatch"></div>
          <select id="colourPicker" aria-label="Choose a colour">
            <option value="red">red</option>
            <option value="blue">blue</option>
            <option value="white">white</option>
          </select>
        </div>
      </div>
      <div class="parts-block">
        <div class="field-label">parts</div>
        <div class="parts" id="parts"></div>
      </div>
      <div class="status" id="status">v1</div>
    </aside>

    <section class="stage-wrap">
      <div id="stage">
        <div class="hint" id="hint">Drag a part onto the paper</div>
        <div class="counter" id="counter">0 / 60</div>
        <div class="counter" id="counter">0 / 60</div>
        <div class="veil" id="veil">
          <div class="card">
            <p>Clear the whole monster?</p>
            <div class="row">
              <button class="btn" id="confirmYes"><span class="glyph">✓</span><span class="lbl">yes</span></button>
              <button class="btn" id="confirmNo"><span class="glyph">✕</span><span class="lbl">no</span></button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <button class="btn is-off" data-act="bigger"><span class="glyph">＋</span><span class="lbl">bigger</span></button>
    <button class="btn is-off" data-act="smaller"><span class="glyph">−</span><span class="lbl">smaller</span></button>
    <button class="btn is-off" data-act="turnL"><span class="glyph">↺</span><span class="lbl">turn left</span></button>
    <button class="btn is-off" data-act="turnR"><span class="glyph">↻</span><span class="lbl">turn right</span></button>
    <button class="btn is-off" data-act="flip"><span class="glyph">⇄</span><span class="lbl">flip</span></button>
    <button class="btn is-off" data-act="back"><span class="glyph">▤</span><span class="lbl">send back</span></button>
    <button class="btn is-off" data-act="delete"><span class="glyph">✕</span><span class="lbl">delete</span></button>
  </footer>

</div>

<div class="sheet" id="shareSheet">
  <div class="sheet-inner">
    <h2>Show your monster</h2>
    <p class="sub">Hold the iPad up. Your teacher points a camera at this.</p>
    <div class="name-row">
      <input id="nameInput" type="text" maxlength="14" placeholder="your name" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="qr-card" id="qrCard"></div>
    <div class="code-line" id="codeLine"></div>
    <div class="sheet-actions">
      <button class="btn" id="copyBtn"><span class="glyph">⧉</span><span class="lbl">copy code</span></button>
      <button class="btn" id="shareClose"><span class="glyph">✕</span><span class="lbl">close</span></button>
    </div>
  </div>
</div>

<div class="sheet" id="gallerySheet">
  <div class="sheet-inner">
    <h2 id="galleryTitle">Our monsters</h2>
    <div class="gallery" id="galleryGrid"></div>
    <div class="sheet-actions">
      <button class="btn" id="galleryClear"><span class="glyph">🗑</span><span class="lbl">clear all</span></button>
      <button class="btn" id="galleryClose"><span class="glyph">✕</span><span class="lbl">close</span></button>
    </div>
  </div>
</div>

<div class="sheet" id="bigSheet">
  <div class="sheet-inner">
    <h2 id="bigName"></h2>
    <div class="g-big" id="bigStage"></div>
    <div class="sheet-actions">
      <button class="btn" id="bigClose"><span class="glyph">✕</span><span class="lbl">close</span></button>
    </div>
  </div>
</div>

<script>
/* Minimal QR encoder - byte mode, EC level L/M, versions 1-15. */

var QR = (function(){
  "use strict";

  var TOTAL = [0,26,44,70,100,134,172,196,242,292,346,404,466,532,581,655];

  // [ecPerBlock, g1Blocks, g1Data, g2Blocks, g2Data]
  var BLOCKS = {
    L: [null,[7,1,19,0,0],[10,1,34,0,0],[15,1,55,0,0],[20,1,80,0,0],[26,1,108,0,0],
        [18,2,68,0,0],[20,2,78,0,0],[24,2,97,0,0],[30,2,116,0,0],[18,2,68,2,69],
        [20,4,81,0,0],[24,2,92,2,93],[26,4,107,0,0],[30,3,115,1,116],[22,5,87,1,88]],
    M: [null,[10,1,16,0,0],[16,1,28,0,0],[26,1,44,0,0],[18,2,32,0,0],[24,2,43,0,0],
        [16,4,27,0,0],[18,4,31,0,0],[22,2,38,2,39],[22,3,36,2,37],[26,4,43,1,44],
        [30,1,50,4,51],[22,6,36,2,37],[22,8,37,1,38],[24,4,40,5,41],[24,5,41,5,42]]
  };

  var ALIGN = [null,[],[6,18],[6,22],[6,26],[6,30],[6,34],
               [6,22,38],[6,24,42],[6,26,46],[6,28,50],[6,30,54],[6,32,58],
               [6,34,62],[6,26,46,66],[6,26,48,70]];

  var REMAINDER = [0,0,7,7,7,7,7,0,0,0,0,0,0,0,3,3];

  var ECBITS = { L:1, M:0 };   // 2-bit EC indicator

  /* ---- GF(256) ---- */
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function(){
    var x = 1;
    for (var i = 0; i < 255; i++){
      EXP[i] = x;
      LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11D;
    }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j-255];
  })();

  function mul(a,b){ return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  function genPoly(deg){
    var p = [1];
    for (var i = 0; i < deg; i++){
      var np = new Array(p.length + 1).fill(0);
      for (var j = 0; j < p.length; j++){
        np[j]   ^= p[j];
        np[j+1] ^= mul(p[j], EXP[i]);
      }
      p = np;
    }
    return p;
  }

  function ecBytes(data, n){
    var gen = genPoly(n);
    var res = new Array(data.length + n).fill(0);
    for (var i = 0; i < data.length; i++) res[i] = data[i];
    for (var i = 0; i < data.length; i++){
      var f = res[i];
      if (f === 0) continue;
      for (var j = 0; j < gen.length; j++) res[i+j] ^= mul(gen[j], f);
    }
    return res.slice(data.length);
  }

  /* ---- bit stream ---- */
  function Bits(){ this.a = []; }
  Bits.prototype.put = function(v, n){
    for (var i = n - 1; i >= 0; i--) this.a.push((v >>> i) & 1);
  };

  function pickVersion(len, ec){
    for (var v = 1; v <= 15; v++){
      var b = BLOCKS[ec][v];
      var dataBytes = b[1]*b[2] + b[3]*b[4];
      var cciBits = v < 10 ? 8 : 16;
      var need = 4 + cciBits + len*8;
      if (need <= dataBytes * 8) return v;
    }
    return -1;
  }

  function buildCodewords(bytes, version, ec){
    var b = BLOCKS[ec][version];
    var ecLen = b[0], totalData = b[1]*b[2] + b[3]*b[4];
    var cciBits = version < 10 ? 8 : 16;

    var bs = new Bits();
    bs.put(4, 4);
    bs.put(bytes.length, cciBits);
    for (var i = 0; i < bytes.length; i++) bs.put(bytes[i], 8);

    var cap = totalData * 8;
    var term = Math.min(4, cap - bs.a.length);
    bs.put(0, term);
    while (bs.a.length % 8 !== 0) bs.a.push(0);

    var data = [];
    for (var i = 0; i < bs.a.length; i += 8){
      var v = 0;
      for (var j = 0; j < 8; j++) v = (v << 1) | bs.a[i+j];
      data.push(v);
    }
    var pads = [0xEC, 0x11], k = 0;
    while (data.length < totalData) data.push(pads[k++ % 2]);

    // split into blocks
    var blocks = [], pos = 0, spec = [];
    for (var i = 0; i < b[1]; i++) spec.push(b[2]);
    for (var i = 0; i < b[3]; i++) spec.push(b[4]);

    for (var i = 0; i < spec.length; i++){
      var d = data.slice(pos, pos + spec[i]);
      pos += spec[i];
      blocks.push({ d:d, e:ecBytes(d, ecLen) });
    }

    var out = [];
    var maxD = Math.max.apply(null, spec);
    for (var i = 0; i < maxD; i++)
      for (var j = 0; j < blocks.length; j++)
        if (i < blocks[j].d.length) out.push(blocks[j].d[i]);
    for (var i = 0; i < ecLen; i++)
      for (var j = 0; j < blocks.length; j++) out.push(blocks[j].e[i]);

    if (out.length !== TOTAL[version]) throw new Error("codeword count " + out.length);
    return out;
  }

  /* ---- matrix ---- */
  function makeMatrix(version){
    var n = version * 4 + 17;
    var m = [], r = [];
    for (var i = 0; i < n; i++){
      m.push(new Int8Array(n).fill(-1));
      r.push(new Uint8Array(n));
    }

    function finder(cx, cy){
      for (var dy = -1; dy <= 7; dy++)
        for (var dx = -1; dx <= 7; dx++){
          var x = cx + dx, y = cy + dy;
          if (x < 0 || y < 0 || x >= n || y >= n) continue;
          var on = (dx >= 0 && dx <= 6 && (dy === 0 || dy === 6)) ||
                   (dy >= 0 && dy <= 6 && (dx === 0 || dx === 6)) ||
                   (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
          m[y][x] = on ? 1 : 0;
          r[y][x] = 1;
        }
    }
    finder(0,0); finder(n-7,0); finder(0,n-7);

    // timing
    for (var i = 8; i < n-8; i++){
      m[6][i] = (i % 2 === 0) ? 1 : 0; r[6][i] = 1;
      m[i][6] = (i % 2 === 0) ? 1 : 0; r[i][6] = 1;
    }

    // alignment
    var ap = ALIGN[version];
    for (var a = 0; a < ap.length; a++)
      for (var b2 = 0; b2 < ap.length; b2++){
        var cx = ap[a], cy = ap[b2];
        var corner = (cx === 6 && cy === 6) ||
                     (cx === 6 && cy === n-7) ||
                     (cx === n-7 && cy === 6);

    if (!btn || !selected) return;
    var s = state.get(selected);

    switch (btn.dataset.act){
      case "bigger":  s.scale = Math.min(5, s.scale * 1.2); place(selected); break;
      case "smaller": s.scale = Math.max(0.25, s.scale / 1.2); place(selected); break;
      case "turnL":   s.rot -= 30; place(selected); break;
      case "turnR":   s.rot += 30; place(selected); break;
      case "flip":    s.flip = -(s.flip || 1); place(selected); break;
      case "back":    s.z = 0; selected.style.zIndex = 0; break;
      case "delete":
        selected.remove();
        select(null);
        updateCounter(false);
        if (!stage.querySelector(".piece")) hint.style.display = "";
        break;
    }
  });

  stage.addEventListener("pointerdown", function(){ select(null); });

  /* ---------- colour ---------- */

  picker.addEventListener("change", function(){
    colour = picker.value;
    renderPalette();
  });

  /* ---------- start again ---------- */

  document.getElementById("resetBtn").addEventListener("click", function(){
    if (!stage.querySelector(".piece")) return;
    veil.classList.add("open");
  });
  document.getElementById("confirmNo").addEventListener("click", function(){
    veil.classList.remove("open");
  });
  document.getElementById("confirmYes").addEventListener("click", function(){
    Array.prototype.forEach.call(stage.querySelectorAll(".piece"), function(p){ p.remove(); });
    select(null);
    updateCounter(false);
    hint.style.display = "";
    veil.classList.remove("open");
  });
  veil.addEventListener("pointerdown", function(e){ e.stopPropagation(); });

  window.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  buildColourMenu();
  renderPalette();
  updateCount();

  /* ---------- monster code ---------- */
  /* Append-only lists: adding entries is safe, reordering breaks old codes. */

  var PART_ORDER   = ["body","arm","leg","head","eye","ear","nose","mouth","hair","horn","wing","tail"];
  var COLOUR_ORDER = ["red","blue","white","yellow","green","orange","purple","pink","brown","black"];
  var FORMAT       = 2;   /* 1 = pre-flip codes, still readable */

  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

  function toB64(bytes){
    var out = "";
    for (var i = 0; i < bytes.length; i += 3){
      var a = bytes[i], b = bytes[i+1], c = bytes[i+2];
      out += B64[a >> 2];
      out += B64[((a & 3) << 4) | ((b === undefined ? 0 : b) >> 4)];
      if (b === undefined) break;
      out += B64[((b & 15) << 2) | ((c === undefined ? 0 : c) >> 6)];
      if (c === undefined) break;
      out += B64[c & 63];
    }
    return out;
  }

  function fromB64(str){
    var bytes = [], buf = 0, bits = 0;
    for (var i = 0; i < str.length; i++){
      var v = B64.indexOf(str[i]);
      if (v < 0) continue;
      buf = (buf << 6) | v; bits += 6;
      if (bits >= 8){ bits -= 8; bytes.push((buf >> bits) & 255); }
    }
    return bytes;
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function utf8Encode(str){
    var out = [];
    for (var i = 0; i < str.length; i++){
      var c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xD800 && c < 0xDC00 && i + 1 < str.length){
        var c2 = str.charCodeAt(++i);
        var cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
        out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63),
                 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      }
      else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }

  function utf8Decode(bytes){
    var out = "", i = 0;
    while (i < bytes.length){
      var c = bytes[i++];
      if (c < 0x80) out += String.fromCharCode(c);
      else if (c >= 0xC0 && c < 0xE0) out += String.fromCharCode(((c & 31) << 6) | (bytes[i++] & 63));
      else if (c >= 0xE0 && c < 0xF0)
        out += String.fromCharCode(((c & 15) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63));
      else if (c >= 0xF0){
        var cp = ((c & 7) << 18) | ((bytes[i++] & 63) << 12) |
                 ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
        cp -= 0x10000;
        out += String.fromCharCode(0xD800 + (cp >> 10), 0xDC00 + (cp & 1023));
      }
    }
    return out;
  }

  function encodeMonster(name){
    var b = stage.getBoundingClientRect();
    var els = Array.prototype.slice.call(stage.querySelectorAll(".piece"));

    els.sort(function(p, q){
      return (state.get(p).z || 0) - (state.get(q).z || 0);
    });

    var bytes = [FORMAT];
    var nb = trimUtf8(utf8Encode(name || ""), 24);
    bytes.push(nb.length);
    for (var i = 0; i < nb.length; i++) bytes.push(nb[i]);
    bytes.push(Math.min(255, els.length));

    els.forEach(function(el){
      var s = state.get(el);
      var pi = PART_ORDER.indexOf(s.key);
      var ci = COLOUR_ORDER.indexOf(s.col);
      if (pi < 0 || ci < 0) return;
      var part = PARTS[s.key];
      var baseH = part.w * part.vb[1] / part.vb[0];
      var frac  = (baseH * s.scale) / b.height;

      bytes.push((pi << 4) | ci);
      bytes.push(clamp(Math.round(s.x / b.width  * 255), 0, 255));
      bytes.push(clamp(Math.round(s.y / b.height * 255), 0, 255));
      bytes.push(clamp(Math.round(frac * 80), 1, 127) | (s.flip === -1 ? 128 : 0));
      bytes.push(((Math.round(s.rot / 360 * 256) % 256) + 256) % 256);
    });

    return toB64(bytes);
  }


  function decodeMonster(code){
    var b = fromB64(code);
    var fmt = b[0];
    if (!b.length || (fmt !== 1 && fmt !== 2)) return null;
    var p = 1, nlen = b[p++], nb = [];
    for (var i = 0; i < nlen; i++) nb.push(b[p++]);
    var name = utf8Decode(nb);
    var count = b[p++], pieces = [];
    for (var i = 0; i < count; i++){
      if (p + 4 >= b.length) break;
      pieces.push({
        part:   b[p] >> 4,
        colour: b[p] & 15,
        x: b[p+1], y: b[p+2], rot: b[p+4],
        sizeFrac: fmt === 1 ? b[p+3] / 160 : (b[p+3] & 127) / 80,
        flip:     fmt === 1 ? 1 : ((b[p+3] & 128) ? -1 : 1)
      });
      p += 5;
    }
    return { name:name, pieces:pieces, code:code };
  }

  function paintMonster(box, mon){
    box.innerHTML = "";
    var w = box.clientWidth, h = box.clientHeight;
    mon.pieces.forEach(function(pc){
      var key = PART_ORDER[pc.part];
      var col = COLOUR_ORDER[pc.colour];
      if (!key || !PARTS[key] || !col) return;
      var part = PARTS[key];
      var ph = pc.sizeFrac * h;
      var pw = ph * part.vb[0] / part.vb[1];

      var el = document.createElement("div");
      el.className = "gpiece";
      el.style.width  = pw + "px";
      el.style.height = ph + "px";
      el.style.left   = (pc.x / 255 * w) + "px";
      el.style.top    = (pc.y / 255 * h) + "px";
      el.style.transform = "translate(-50%,-50%) rotate(" + (pc.rot * 360 / 256) +
                           "deg) scale(" + pc.flip + ",1)";
      el.innerHTML = svgFor(key, COLOURS[col]);
      box.appendChild(el);
    });
  }

  /* ---------- share sheet ---------- */

  var shareSheet = document.getElementById("shareSheet");
  var qrCard     = document.getElementById("qrCard");
  var codeLine   = document.getElementById("codeLine");
  var nameInput  = document.getElementById("nameInput");

  function shareUrl(code){
    var web = location.protocol === "https:" || location.protocol === "http:";
    return web ? location.origin + location.pathname + "#m=" + code : code;
  }

  function qrSvg(text){
    var r;
    try { r = QR.encode(text, "M"); }
    catch (e){
      try { r = QR.encode(text, "L"); }
      catch (e2){ return "<p class='empty-note'>This monster has too many parts to fit in a code.</p>"; }
    }
    var q = 4, n = r.size, total = n + q * 2, d = "";
    for (var y = 0; y < n; y++)
      for (var x = 0; x < n; x++)
        if (r.modules[y][x]) d += "M" + (x + q) + " " + (y + q) + "h1v1h-1z";
    return '<svg viewBox="0 0 ' + total + ' ' + total + '" shape-rendering="crispEdges" ' +
           'xmlns="http://www.w3.org/2000/svg"><rect width="' + total + '" height="' + total +
           '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }

  function refreshShare(){
    var code = encodeMonster(nameInput.value);
    var url  = shareUrl(code);
    qrCard.innerHTML = qrSvg(url);
    codeLine.textContent = code;
  }

  document.getElementById("shareBtn").addEventListener("click", function(){
    if (!stage.querySelector(".piece")) return;
    select(null);
    shareSheet.classList.add("open");
    refreshShare();
  });
  nameInput.addEventListener("input", refreshShare);
  document.getElementById("shareClose").addEventListener("click", function(){
    shareSheet.classList.remove("open");
  });
  document.getElementById("copyBtn").addEventListener("click", function(){
    var t = codeLine.textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
    else {
      var ta = document.createElement("textarea");
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch(e){}
      ta.remove();
    }
  });

  /* ---------- gallery ---------- */

  var STORE = "monster-gallery";
  var gallerySheet = document.getElementById("gallerySheet");
  var galleryGrid  = document.getElementById("galleryGrid");
  var galleryBtn   = document.getElementById("galleryBtn");
  var bigSheet     = document.getElementById("bigSheet");

  function loadGallery(){
    try { return JSON.parse(localStorage.getItem(STORE) || "[]"); }
    catch (e){ return []; }
  }
  function saveGallery(list){
    try { localStorage.setItem(STORE, JSON.stringify(list)); } catch (e){}
  }

  function refreshGalleryBtn(){
    var list = loadGallery();
    galleryBtn.style.display = list.length ? "" : "none";
    galleryBtn.querySelector(".lbl").textContent = "monsters (" + list.length + ")";
  }

  function openGallery(){
    var list = loadGallery();
    galleryGrid.innerHTML = "";
    if (!list.length){
      galleryGrid.innerHTML = "<p class='empty-note'>No monsters collected yet.</p>";
    }
    list.forEach(function(code, i){
      var mon = decodeMonster(code);
      if (!mon) return;
      var card = document.createElement("div");
      card.className = "g-card";
      card.innerHTML = '<div class="g-stage"></div><div class="g-name"></div>';
      card.querySelector(".g-name").textContent = mon.name || ("Monster " + (i + 1));
      galleryGrid.appendChild(card);
      paintMonster(card.querySelector(".g-stage"), mon);
      card.addEventListener("click", function(){ openBig(mon, i); });
    });
    gallerySheet.classList.add("open");
  }

  function openBig(mon, i){
    document.getElementById("bigName").textContent = mon.name || ("Monster " + (i + 1));
    bigSheet.classList.add("open");
    paintMonster(document.getElementById("bigStage"), mon);
  }

  galleryBtn.addEventListener("click", openGallery);
  document.getElementById("galleryClose").addEventListener("click", function(){
    gallerySheet.classList.remove("open");
  });
  document.getElementById("bigClose").addEventListener("click", function(){
    bigSheet.classList.remove("open");
  });
  document.getElementById("galleryClear").addEventListener("click", function(){
    saveGallery([]);
    refreshGalleryBtn();
    openGallery();
  });

  /* a monster arriving from a scanned code */
  (function(){
    var m = location.hash.match(/#m=([A-Za-z0-9\-_]+)/);
    if (!m) return;
    var code = m[1];
    if (history.replaceState) history.replaceState(null, "", location.pathname);
    if (!decodeMonster(code)) return;
    var list = loadGallery();
    if (list.indexOf(code) === -1){ list.push(code); saveGallery(list); }
    refreshGalleryBtn();
    setTimeout(openGallery, 60);
  })();

  refreshGalleryBtn();

  /* ---------- offline storage ---------- */

  var VERSION = "v8";
  var statusEl = document.getElementById("status");

  function showStatus(){
    var saved = ("serviceWorker" in navigator) && navigator.serviceWorker.controller;
    statusEl.textContent = VERSION + (saved ? " · saved on this iPad" : "");
  }

  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js", { scope:"./" })
        .then(showStatus)
        .catch(function(){ statusEl.textContent = VERSION; });
    });
    navigator.serviceWorker.addEventListener("controllerchange", showStatus);
  }
  showStatus();
})();
</script>
</body>
</html>
